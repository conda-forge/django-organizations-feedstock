context:
  name: django-organizations
  version: "2.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # NOTE: the source pypi archive is broken (no src/ folder in it)
  url: https://github.com/bennylope/django-organizations/archive/refs/tags/v${{ version }}.zip
  sha256: 80932789d533a1076840f76787011dd3d5dfe324931ce31c772e796d67440c5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - django-extensions >=2.0.8

tests:
  - python:
      imports:
        - organizations
      python_version: ${{ python_min }}.*

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Multi-user accounts for Django projects
  homepage: https://github.com/bennylope/django-organizations

extra:
  recipe-maintainers:
    - hadim
